[package]
name = "zinc_oxide"
version = "0.1.0"
authors = ["Amadeus Mader <amadeus@mozart409.com"]
edition = "2024"
description = "A rust cli that checks recursively for git projects and reports their statuses"
readme = "README.md"
homepage = "https://zinc-oxide.mozart409.com"
license-file = "LICENSE"
repository = "https://github.com/Mozart409/zinc_oxide"
keywords = ["git", "cli"]
categories = ["command-line-utilities"]
exclude = ["/website", ]
publish = false

[dependencies]
color-eyre = { version = "0.6.5", default-features = false }
gumdrop = "0.8.1"
git2 = { version = "0.20.2", features = ["vendored-libgit2"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"

