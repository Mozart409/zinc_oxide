[package]
name = "zinc_oxide"
version = "0.1.7"
authors = ["Amadeus Mader <amadeus@mozart409.com"]
categories = ["command-line-utilities"]
edition = "2024"
exclude = ["/website"]
homepage = "https://zinc-oxide.mozart409.com"
keywords = ["git", "cli"]
license = "MIT"
publish = false
readme = "README.md"
repository = "https://github.com/Mozart409/zinc_oxide"
description = "A rust cli that checks recursively for git projects and reports their statuses"

[package.metadata.deb]
name = "zinc_oxide"
maintainer = "Amadeus Mader <amadeus@mozart409.com>"
copyright = "2025 Amadeus Mader"
license-file = ["LICENSE"]
section = "utility"
priority = "optional"

[package.metadata.generate-rpm]
license = "MIT"
assets = [
  { source = "target/release/zinc_oxide", dest = "/usr/bin/zinc_oxide", mode = "755" },
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = { version = "0.6.5", default-features = false }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
serde_json = { version = "1.0", optional = true }
tempfile = { version = "3.27", optional = true }

[features]
default = []
nix = ["dep:serde_json", "dep:tempfile"]

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[lints.rust]
warnings = "deny"

[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
