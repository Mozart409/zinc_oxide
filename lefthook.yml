# https://lefthook.dev/configuration/
#
# Run `lefthook install` to install hooks after cloning.
pre-commit:
  parallel: true
  jobs:
    - name: keep-sorted
      run: keep-sorted {staged_files}
      glob: "*.nix"
      stage_fixed: true
    - name: format then lint
      group:
        piped: true
        jobs:
          - name: dprint fmt
            glob: "*.{ts,tsx,js,jsx,cjs,mjs,json,jsonc,md,toml,yml,yaml,html,htm,css,scss,less,vue,svelte,astro}"
            exclude: CHANGELOG.md
            run: dprint fmt --allow-no-files {staged_files}
            stage_fixed: true
          - name: just lint
            run: just lint
    - name: cargo test
      run: cargo test
commit-msg:
  jobs:
    - name: cog verify
      run: cog verify --file {1}
pre-push:
  parallel: true
  jobs:
    - name: keep-sorted
      run: keep-sorted --mode=lint {all_files}
      glob: "*.nix"
    - name: cargo deny
      run: cargo deny check
    - name: release build
      run: cargo build --release --features nix
    - name: just lint
      run: just lint
    - name: website test
      root: website/
      run: nr test
