name: Rust

on:
  push:
    tags:
      - v*

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build Release
      run: cargo build --release
    - name: Run tests
      run: cargo test
    - name: Build deb
      run: cargo deb
    - name: Build rpm
      run: cargo generate-rpm
