name: Rust
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,dprint,cargo-hack
      - name: Lint
        run: just lint
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - name: Build
        run: cargo build --release
      - name: Run tests
        run: cargo test
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo tools
        run: cargo binstall cargo-deb cargo-generate-rpm
      - name: Create deb
        run: cargo deb
      - name: Create rpm
        run: cargo generate-rpm
  nix-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack
      - name: Build and test every feature combination
        run: just features
      - name: Build flake package
        run: just nix-build
